# Render Blueprint for MyDataSign: demo only.
# Creates ONE free static site with sample data. It needs no database and no keys.
# Deploy: Render Dashboard → New → Blueprint → select this repository.
#
# The full marketplace (web service + PostgreSQL + demo) is kept in
# blueprints/render.full.yaml. To use it, set the Blueprint path to that file in Render.

services:
  - type: web
    name: mydatasign-demo
    runtime: static
    buildCommand: npm ci && npm run build:demo
    staticPublishPath: ./demo-dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
